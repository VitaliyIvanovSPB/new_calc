<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ЧО</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    Палитра и шрифт — по открытому брендбуку Selectel (brand.selectel.ru):
    Signal Red EB4247, Data Blue 092433, Server Grey E3E6E7, шрифт Manrope
    (фолбэк Arial). Рекомендованное соотношение цветов брендбука: 30% Data
    Blue, 30% белый, 20% Signal Red, 15% текстовый чёрный, 5% холодный серый —
    синий и белый преобладают в фонах и структуре, красный — только акцент
    (кнопки, бейджи, лучшая цена, фокус), не основной цвет интерфейса.
  */
  :root{
    --accent:#eb4247;        /* Signal Red — акцент: кнопки, бейджи, фокус */
    --accent-dark:#be3c43;
    --accent-soft:#fdeced;
    --navy:#092433;          /* Data Blue — тёмные фоны, заголовки, крупный текст */
    --text:#142d3c;
    --muted:#738089;         /* Cool Gray из расширенной палитры */
    --line:#e3e6e7;          /* Server Grey */
    --surface:#f1f2f3;
    --white:#fff;
    --ok:#12a150;
    --err:#be3c43;
    --r-lg:24px;
    --r-md:14px;
    --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--surface);
    color:var(--text);
    font-family:'Manrope','Segoe UI',Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
  }

  /* ---- шапка ---- */
  header{
    background:var(--white);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .header-in{
    max-width:1120px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    flex:none;
  }
  .logo svg{ display:block; }
  header strong{ font-size:17px; color:var(--navy); }

  /* ---- первый экран ---- */
  .hero{
    background:var(--navy);
    color:#fff;
    padding:56px 24px 120px;
  }
  .hero-in{ max-width:1120px; margin:0 auto; }
  .hero h1{
    margin:0 0 14px;
    font-size:clamp(30px,5vw,48px);
    line-height:1.1;
    font-weight:800;
    letter-spacing:-.02em;
    max-width:720px;
  }
  .hero p{
    margin:0;
    max-width:560px;
    color:#aebbd3;
    font-size:17px;
  }

  main{
    max-width:1120px;
    margin:-72px auto 80px;
    padding:0 24px;
  }

  /* ---- форма ---- */
  .panel{
    background:var(--white);
    border-radius:var(--r-lg);
    padding:32px 36px 12px;
    box-shadow:0 12px 40px rgba(13,27,51,.10);
  }
  .section-title{
    font-size:22px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 8px;
  }
  table.params{
    width:100%;
    border-collapse:collapse;
    margin-bottom:8px;
  }
  table.params > tbody > tr > td,
  table.params > tr > td{
    padding:14px 0;
    vertical-align:top;
    border-bottom:1px solid var(--line);
  }
  .p-name{
    font-weight:600;
    color:var(--navy);
    width:260px;
    padding-right:20px;
  }
  .p-required{
    color:var(--err);
    font-size:12px;
    font-weight:400;
    display:block;
  }
  .p-type{
    color:var(--muted);
    font-size:13px;
    font-weight:400;
    display:block;
  }
  .p-input input,
  .p-input select{
    width:100%;
    max-width:320px;
    height:44px;
    padding:0 14px;
    border:1.5px solid var(--line);
    border-radius:var(--r-md);
    font:inherit;
    background:var(--white);
    color:var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  .p-input input:hover,
  .p-input select:hover{ border-color:#c5cfdf; }
  .p-input input:focus,
  .p-input select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft);
  }
  .p-input input:invalid{ border-color:var(--err); }
  .p-input input:disabled,
  .p-input select:disabled{
    background:var(--surface);
    color:var(--muted);
    cursor:not-allowed;
  }

  /* ---- профили VDI ---- */
  #vdi-profiles-row{ display:none; }
  .vdi-block{
    background:var(--accent-soft);
    border-radius:var(--r-md);
    padding:20px 20px 18px;
  }
  .vdi-title{
    font-size:16px;
    font-weight:700;
    color:var(--navy);
    margin:0 0 12px;
  }
  .vdi-scroll{ overflow-x:auto; }
  table.vdi-table{
    width:100%;
    min-width:560px;
    border-collapse:collapse;
    background:var(--white);
    border-radius:var(--r-md);
    overflow:hidden;
  }
  table.vdi-table th{
    text-align:left;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  table.vdi-table td{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  table.vdi-table tr:last-child td{ border-bottom:none; }
  table.vdi-table td.vdi-label{ font-weight:600; white-space:nowrap; color:var(--navy); }
  table.vdi-table input{
    width:100%;
    min-width:70px;
    height:38px;
    padding:0 10px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font:inherit;
  }
  table.vdi-table input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .vdi-totals{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .vt-item{
    background:var(--white);
    border-radius:999px;
    padding:6px 14px;
    font-size:14px;
  }
  .vt-item b{ color:var(--accent-dark); }

  /* ---- кнопка ---- */
  .execute-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px 0 24px;
    flex-wrap:wrap;
  }
  button.execute{
    background:var(--accent);
    color:#fff;
    border:none;
    font:inherit;
    font-weight:600;
    font-size:16px;
    height:50px;
    padding:0 36px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s;
  }
  button.execute:hover{ background:var(--accent-dark); }
  button.execute:focus-visible{ outline:3px solid var(--accent-soft); outline-offset:2px; }
  button.execute:disabled{ background:#c9ced1; cursor:default; }
  .status-inline{ font-size:14px; color:var(--muted); visibility:hidden; }
  .status-inline.ok{ color:var(--ok); }
  .status-inline.err{ color:var(--err); }

  /* ---- результаты ---- */
  #results-wrap{ margin-top:40px; }
  #results-summary{ font-size:22px; font-weight:700; color:var(--navy); margin-bottom:16px; }
  .empty-state{ background:var(--white); border-radius:var(--r-lg); padding:40px; text-align:center; color:var(--muted); }
  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));
    gap:24px;
    align-items:stretch;
  }
  .config-card{
    background:var(--white);
    border:2px solid transparent;
    border-radius:var(--r-lg);
    padding:28px;
    box-shadow:0 4px 20px rgba(13,27,51,.06);
    display:flex;
    flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .config-card:hover{ transform:translateY(-4px); box-shadow:0 14px 36px rgba(13,27,51,.12); }
  .config-card.best{ border-color:var(--accent); }
  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .card-title{ margin:0; font-size:19px; font-weight:700; color:var(--navy); }
  .vbadge{
    display:inline-block;
    margin-top:8px;
    padding:2px 12px;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font-size:13px;
    font-weight:600;
  }
  .card-price{ text-align:right; }
  .price-value{ font-size:28px; font-weight:800; line-height:1.15; color:var(--navy); white-space:nowrap; letter-spacing:-.01em; }
  .price-note{ font-size:13px; color:var(--muted); }
  .card-section{ margin-bottom:22px; }
  .card-section h4{ display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:15px; font-weight:700; color:var(--navy); }
  .section-icon{ display:inline-flex; color:var(--accent); flex:none; }
  .specs-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; }
  .spec-label{ display:block; font-size:13px; color:var(--muted); margin-bottom:2px; }
  .spec-value{ display:block; font-weight:600; color:var(--navy); word-break:break-word; }
  .hw-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .hw-list li{ display:flex; gap:10px; font-size:14px; line-height:1.4; }
  .hw-list li::before{ content:""; flex:none; width:6px; height:6px; margin-top:8px; border-radius:50%; background:var(--accent); }
  .hw-list b{ font-weight:600; color:var(--navy); }
  .card-footer{ margin-top:auto; padding-top:20px; border-top:1px solid var(--line); }
  .btn-order{
    width:100%;
    height:48px;
    border:none;
    border-radius:999px;
    background:var(--accent);
    color:#fff;
    font:inherit;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:background .15s;
  }
  .btn-order:hover{ background:var(--accent-dark); }
  .btn-order:focus-visible{ outline:3px solid var(--accent-soft); outline-offset:2px; }

  /* подсказки (тултипы) */
  .tooltip{ position:relative; display:inline-block; cursor:help; border-bottom:1px dotted var(--muted); transition:color .2s, border-color .2s; }
  .tooltip:hover, .tooltip:focus{ outline:none; color:var(--accent-dark); border-bottom-color:var(--accent-dark); }
  .tooltip-text{
    visibility:hidden;
    opacity:0;
    position:absolute;
    bottom:calc(100% + 8px);
    left:0;
    width:240px;
    padding:10px 14px;
    border-radius:10px;
    background:var(--navy);
    color:#fff;
    font-size:12px;
    font-weight:400;
    line-height:1.4;
    text-align:left;
    z-index:10;
    pointer-events:none;
    box-shadow:0 8px 16px rgba(13,27,51,.2);
    transition:opacity .2s;
  }
  .tooltip:hover .tooltip-text, .tooltip:focus .tooltip-text{ visibility:visible; opacity:1; }

  pre.raw-json{
    background:var(--navy);
    color:#c9d6ee;
    font-family:var(--mono);
    font-size:13px;
    padding:16px 20px;
    border-radius:var(--r-md);
    overflow-x:auto;
    display:none;
  }

  @media (max-width:720px){
    .panel{ padding:24px 20px 8px; }
    table.params, table.params tbody, table.params tr, table.params td{ display:block; width:100%; }
    table.params td{ border-bottom:none; padding:8px 0 0; }
    .p-name{ width:100%; padding-right:0; }
    .p-input input, .p-input select{ max-width:100%; }
    .hero{ padding:36px 20px 100px; }
    main{ padding:0 12px; }
    .config-card{ padding:20px; } .price-value{ font-size:24px; } .specs-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-in">
    <div class="logo" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="4" fill="#EB4247"/>
        <path d="M24.8867 17.5585C24.192 16.6277 23.3585 15.9762 22.4323 15.5108C21.5061 15.0919 20.441 14.7196 19.2833 14.3939L14.8376 13.0908C13.7262 12.8115 12.8463 12.4392 12.1517 12.0204C11.5033 11.6015 11.1329 10.95 11.1329 10.0657C11.1329 9.41421 11.3644 8.85574 11.7812 8.34381C12.198 7.83189 12.8 7.45958 13.5409 7.18034C14.2819 6.90111 15.0691 6.80803 15.8564 6.80803C17.1994 6.85457 18.3571 7.22688 19.3759 7.9715C20.3947 8.71612 21.043 9.73998 21.3209 10.9965L25.7202 10.2519C25.3498 8.71612 24.7014 7.3665 23.8216 6.29611C22.9417 5.22571 21.8303 4.38802 20.441 3.82955C19.098 3.27108 17.5698 2.94531 15.9027 2.94531C14.2356 2.99185 12.7074 3.22455 11.3181 3.82955C9.92884 4.38802 8.86373 5.22571 8.07647 6.34264C7.28922 7.41304 6.87244 8.76266 6.87244 10.2984C6.87244 12.2065 7.38184 13.6492 8.44695 14.58C9.51205 15.5108 10.8087 16.2089 12.3832 16.6277L18.8665 18.5823C19.839 18.8616 20.5336 19.2804 20.9967 19.7458C21.0779 19.8274 21.1433 19.9091 21.2021 20H25.837C25.7166 19.024 25.3622 18.2101 24.8867 17.5585Z" fill="white"/>
        <path d="M21.632 22H25.8973C25.7902 23.3487 25.3749 24.5212 24.6089 25.5174C23.6827 26.6809 22.525 27.5651 21.0431 28.1701C19.5612 28.7751 17.9404 29.0543 16.1806 29.0543C14.3746 29.0543 12.7538 28.7286 11.2719 28.077C9.78999 27.4255 8.58595 26.5413 7.65977 25.3312C6.73359 24.1212 6.13157 22.7251 5.90002 21.1428L10.1605 20.4912C10.5309 21.9805 11.2719 23.0974 12.4296 23.9351C13.5873 24.7728 14.9303 25.1916 16.4585 25.1916C17.8941 25.1916 19.1444 24.8659 20.1632 24.2143C21.0518 23.6339 21.5141 22.8821 21.632 22Z" fill="white"/>
      </svg>
    </div>
    <strong>Калькулятор ЧО</strong>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <h1>Подбор конфигурации частного облака</h1>
    <p>Для расчета укажите необходимые ресурсы</p>
  </div>
</section>

<main>
  <section class="panel">
    <p class="section-title">Параметры</p>

    <table class="params" id="params-table">
      <!-- строки генерируются в JS ниже по описанию PARAMS -->
    </table>

    <div class="execute-row">
      <button class="execute" id="execute-btn">Рассчитать</button>
      <span class="status-inline" id="status-inline"></span>
    </div>
  </section>

  <div id="results-wrap"></div>
</main>

<script>
function optionLabel(value) {
  return String(value).toUpperCase();
}

const PARAMS = [
  { name:"works_main", label:"Тип ЧО", type:"enum", required:true, options:[], value:"" },
  { name:"vcpu", label:"vCPU", hint:"количество виртуальных ядер", type:"integer", required:true, min:1, value:400 },
  { name:"vram", label:"vRAM, ГБ", hint:"объём виртуальной памяти", type:"integer", required:true, min:1, value:1000 },
  { name:"vssd", label:"vSSD, ГБ", hint:"объём дискового пространства", type:"integer", required:true, min:1, value:22000 },
  { name:"vgpu", label:"vGPU, ГБ", hint:"объём видеопамяти", type:"integer", required:false, min:0, value:0 },
  { name:"cpu_min_frequency", label:"Мин. частота CPU, МГц", type:"integer", required:true, min:1, value:2000 },
  { name:"cpu_overcommit", label:"CPU overcommit", hint:"коэффициент переподписки CPU", type:"number", required:true, min:1, value:1, step:1 },
  { name:"cpu_vendor", label:"Вендор CPU", type:"enum", required:true, options:[], value:"" },
  // { name:"vsan_type", label:"Тип vSAN", type:"enum", required:true, options:["osa","esa"], value:"osa" },
  { name:"capacity_disk_type", label:"Тип дисков", type:"enum", required:true, options:[], value:"" },
];

// Поля из PARAMS, значения которых берутся с бэкенда (/field-options).
const DB_DRIVEN_ENUM_FIELDS = ["works_main", "cpu_vendor", "capacity_disk_type"];

function applyFieldOptions(fieldOptions) {
  DB_DRIVEN_ENUM_FIELDS.forEach(name => {
    const options = fieldOptions && fieldOptions[name];
    if (!Array.isArray(options) || options.length === 0) return;
    const param = PARAMS.find(p => p.name === name);
    if (!param) return;
    param.options = options;
    if (!options.includes(param.value)) param.value = options[0];
  });
}

async function loadFieldOptions() {
  let data;
  try {
    const resp = await fetch("/field-options", { headers: { accept: "application/json" } });
    if (!resp.ok) return false;
    data = await resp.json();
  } catch (e) {
    return false;
  }
  applyFieldOptions(data);
  return DB_DRIVEN_ENUM_FIELDS.every(name => Array.isArray(data[name]) && data[name].length > 0);
}

// ---- Профили рабочих столов VDI ----
// Показываются только при works_main === "vdi". Ресурсы каждого профиля
// умножаются на "Кол-во" и суммируются; итог подставляется в vcpu / vram /
// vssd / vgpu основной формы (в этом режиме они блокируются). Сами профили
// уходят на бэкенд в поле vdi_profiles (JSON-массив).
const VDI_RESOURCE_FIELDS = [
  { key:"vcpu", label:"vCPU, шт" },
  { key:"vram", label:"vRAM, GB" },
  { key:"vssd", label:"vSSD, GB" },
  { key:"vgpu", label:"GPU, GB" },
];

const VDI_PROFILES = [
  { name:"Рабочий стол 1", vcpu:4,  vram:8, vssd:200, vgpu:0, count:100 },
  { name:"Рабочий стол 2", vcpu:6,  vram:24, vssd:200, vgpu:0, count:0 },
  { name:"Рабочий стол 3", vcpu:8,  vram:48, vssd:200, vgpu:0, count:0 },
  { name:"Рабочий стол 4", vcpu:12, vram:64, vssd:200, vgpu:0, count:0 },
];

const paramsTable = document.getElementById("params-table");

function renderParamsTable() {
PARAMS.forEach(p => {
  const tr = document.createElement("tr");

  const tdName = document.createElement("td");
  tdName.className = "p-name";
  tdName.innerHTML = `${p.label}${p.required ? '<span class="p-required">обязательное</span>' : ''}${p.hint ? `<span class="p-type">${p.hint}</span>` : ''}`;

  const tdInput = document.createElement("td");
  tdInput.className = "p-input";

  let input;
  if (p.type === "enum") {
    input = document.createElement("select");
    p.options.forEach(opt => {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = optionLabel(opt);
      if (opt === p.value) o.selected = true;
      input.appendChild(o);
    });
  } else {
    input = document.createElement("input");
    input.type = "number";
    if (p.min !== undefined) input.min = p.min;
    if (p.step !== undefined) input.step = p.step;
    input.value = p.value;
  }
  input.required = p.required;
  input.dataset.param = p.name;
  input.id = "param-" + p.name;

  tdInput.appendChild(input);

  input.addEventListener("input", updateExecuteAvailability);
  input.addEventListener("change", updateExecuteAvailability);

  tr.appendChild(tdName);
  tr.appendChild(tdInput);
  paramsTable.appendChild(tr);

  // сразу после строки "Тип ЧО" вставляем скрытый блок профилей VDI
  if (p.name === "works_main") {
    const vdiRow = document.createElement("tr");
    vdiRow.id = "vdi-profiles-row";
    const vdiCell = document.createElement("td");
    vdiCell.colSpan = 2;
    vdiCell.appendChild(buildVdiBlock());
    vdiRow.appendChild(vdiCell);
    paramsTable.appendChild(vdiRow);
  }
});
}

function buildVdiBlock() {
  const wrap = document.createElement("div");
  wrap.className = "vdi-block";

  const title = document.createElement("p");
  title.className = "vdi-title";
  title.textContent = "Профили рабочих столов VDI";
  wrap.appendChild(title);

  const scroll = document.createElement("div");
  scroll.className = "vdi-scroll";
  const table = document.createElement("table");
  table.className = "vdi-table";

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  headRow.innerHTML = `<th>Роль</th>` + VDI_RESOURCE_FIELDS.map(f => `<th>${f.label}</th>`).join("") + `<th>Кол-во</th>`;
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  VDI_PROFILES.forEach((profile, idx) => {
    const tr = document.createElement("tr");

    const tdLabel = document.createElement("td");
    tdLabel.className = "vdi-label";
    tdLabel.textContent = profile.name;
    tr.appendChild(tdLabel);

    VDI_RESOURCE_FIELDS.forEach(f => {
      const td = document.createElement("td");
      const inp = document.createElement("input");
      inp.type = "number";
      inp.min = "0";
      inp.value = profile[f.key];
      inp.id = `vdi-${idx}-${f.key}`;
      inp.dataset.profileIdx = idx;
      inp.dataset.field = f.key;
      inp.addEventListener("input", onVdiProfileInput);
      td.appendChild(inp);
      tr.appendChild(td);
    });

    const tdCount = document.createElement("td");
    const countInp = document.createElement("input");
    countInp.type = "number";
    countInp.min = "0";
    countInp.value = profile.count;
    countInp.id = `vdi-${idx}-count`;
    countInp.dataset.profileIdx = idx;
    countInp.dataset.field = "count";
    countInp.addEventListener("input", onVdiProfileInput);
    tdCount.appendChild(countInp);
    tr.appendChild(tdCount);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  wrap.appendChild(scroll);

  const totals = document.createElement("div");
  totals.className = "vdi-totals";
  totals.id = "vdi-totals";
  wrap.appendChild(totals);

  return wrap;
}

function onVdiProfileInput(e) {
  const idx = Number(e.target.dataset.profileIdx);
  const field = e.target.dataset.field;
  const val = Number(e.target.value) || 0;
  VDI_PROFILES[idx][field] = val;
  recalcVdiTotals();
}

function recalcVdiTotals() {
  const sums = { vcpu:0, vram:0, vssd:0, vgpu:0 };
  VDI_PROFILES.forEach(profile => {
    const count = Number(profile.count) || 0;
    VDI_RESOURCE_FIELDS.forEach(f => {
      sums[f.key] += (Number(profile[f.key]) || 0) * count;
    });
  });

  ["vcpu","vram","vssd","vgpu"].forEach(key => {
    const el = document.getElementById("param-" + key);
    if (el) el.value = sums[key];
  });

  const totalsEl = document.getElementById("vdi-totals");
  if (totalsEl) {
    totalsEl.innerHTML = VDI_RESOURCE_FIELDS.map(f =>
      `<span class="vt-item">${f.label}: <b>${sums[f.key]}</b></span>`
    ).join("");
  }

  updateExecuteAvailability();
}

function toggleVdiMode() {
  const worksSelect = document.getElementById("param-works_main");
  const vdiRow = document.getElementById("vdi-profiles-row");
  const isVdi = worksSelect.value.toLowerCase() === "vdi";

  vdiRow.style.display = isVdi ? "table-row" : "none";

  // В режиме VDI четыре поля заполняются из профилей и не редактируются
  // вручную — прячем строку целиком, чтобы не дублировать итоги блока профилей.
  ["vcpu","vram","vssd","vgpu"].forEach(key => {
    const el = document.getElementById("param-" + key);
    if (!el) return;
    el.disabled = isVdi;
    const row = el.closest("tr");
    if (row) row.style.display = isVdi ? "none" : "";
  });

  if (isVdi) {
    recalcVdiTotals();
  } else {
    updateExecuteAvailability();
  }
}

async function init() {
  const loaded = await loadFieldOptions();
  renderParamsTable();
  document.getElementById("param-works_main").addEventListener("change", toggleVdiMode);

  if (!loaded) {
    const statusEl = document.getElementById("status-inline");
    statusEl.textContent = "Не удалось загрузить справочники (Тип ЧО / Вендор CPU / Тип дисков) с сервера. Обновите страницу.";
    statusEl.className = "status-inline err";
    document.getElementById("execute-btn").disabled = true;
    return;
  }

  // works_main после applyFieldOptions() может сразу оказаться "VDI" —
  // без этого вызова блок профилей остался бы скрыт, а поля vcpu/vram/vssd/vgpu
  // — редактируемыми вручную.
  toggleVdiMode();
}
init();

function updateExecuteAvailability() {
  const btn = document.getElementById("execute-btn");
  const worksSelect = document.getElementById("param-works_main");
  const isVdi = worksSelect && worksSelect.value.toLowerCase() === "vdi";

  const allValid = PARAMS.every(p => {
    const el = document.getElementById("param-" + p.name);
    // В VDI-режиме vcpu/vram/vssd/vgpu disabled (checkValidity всегда true),
    // их положительность проверяем отдельно ниже.
    if (isVdi && ["vcpu", "vram", "vssd", "vgpu"].includes(p.name)) return true;
    return el.checkValidity();
  });

  // Итоговые суммы по профилям должны быть > 0, иначе бэкенд вернёт сырую
  // ошибку валидации FastAPI (gt=0).
  let vdiSumsValid = true;
  if (isVdi) {
    const sums = { vcpu: 0, vram: 0, vssd: 0 };
    VDI_PROFILES.forEach(profile => {
      const count = Number(profile.count) || 0;
      sums.vcpu += (Number(profile.vcpu) || 0) * count;
      sums.vram += (Number(profile.vram) || 0) * count;
      sums.vssd += (Number(profile.vssd) || 0) * count;
    });
    vdiSumsValid = sums.vcpu > 0 && sums.vram > 0 && sums.vssd > 0;
  }

  btn.disabled = !allValid || !vdiSumsValid;
}

function collectParams() {
  const values = {};
  let valid = true;
  PARAMS.forEach(p => {
    const el = document.getElementById("param-" + p.name);
    if (!el.checkValidity()) valid = false;
    values[p.name] = el.value;
  });

  if (values.works_main.toLowerCase() === "vdi") {
    values.vdi_profiles = JSON.stringify(VDI_PROFILES);
  }

  return { values, valid };
}

function buildQueryString(values) {
  const usp = new URLSearchParams();
  Object.entries(values).forEach(([k, v]) => usp.append(k, v));
  return usp.toString();
}

function formatFieldValue(val) {
  if (!Array.isArray(val)) return val;
  const [main, unit] = val;
  const formattedMain = typeof main === "number" ? main.toLocaleString("ru-RU") : main;
  return unit ? `${formattedMain} ${unit}` : `${formattedMain}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function fmt(val) {
  if (Array.isArray(val)) return formatFieldValue(val);
  if (typeof val === "boolean") return val ? "Да" : "Нет";
  if (typeof val === "number") return val.toLocaleString("ru-RU");
  return val;
}

// Для списка оборудования: ["Intel Xeon 6517P", "2 шт"] -> "Intel Xeon 6517P - 2 шт"; пусто -> "нет".
// Разделитель — обычный короткий дефис "-" с пробелами по обе стороны (как в макете),
// а не длинное тире, и добавляется всегда, когда unit определён (в т.ч. "0 шт"), а не
// только когда он "truthy" — иначе дефис пропадал для количеств вида 0.
function fmtHw(val) {
  if (val === null || val === undefined || val === "" || val === false) return "нет";
  if (Array.isArray(val)) {
    const [main, unit] = val;
    const m = typeof main === "number" ? main.toLocaleString("ru-RU") : main;
    return (unit !== undefined && unit !== null && unit !== "") ? `${m} - ${unit}` : `${m}`;
  }
  return fmt(val);
}

function specItem(label, value, tip) {

  d.innerHTML = `<span class="spec-label">${l}</span><span class="spec-value">${esc(value)}</span>`;
  return d;
}

// Заглушка кнопки «Заказать»: сюда вешается реальное действие (переход, форма заявки и т.п.).
// В лог уходит то же самое, что показано на карточке (запрошенные ресурсы, кластер,
// оборудование, цена), плюс поле "Max CPU usage" из ответа /config, которое на самой
// карточке пока не отображается.
function buildOrderPayload(item, request) {
  request = request || {};
  const payload = {};

  REQUESTED.forEach(r => {
    let v = r.api && item[r.api] != null ? item[r.api] : request[r.param];
    if (v === undefined || v === "") return;
    let text = fmt(Number.isFinite(Number(v)) && !Array.isArray(v) ? Number(v) : v);
    if (r.unit) text += " " + r.unit;
    payload[r.label] = text;
  });

  if (item[HOSTS_KEY] != null) {
    const label = item[REDUNDANCY_KEY] ? `Кол-во хостов (${item[REDUNDANCY_KEY]})` : "Кол-во хостов";
    payload[label] = fmt(item[HOSTS_KEY]);
  }
  const raidVals = RAID_KEYS.map(k => item[k]).filter(v => v != null && v !== "").map(v => String(fmt(v)));
  if (raidVals.length) {
    const raid = raidVals.find(v => /raid/i.test(v));
    const fttRaw = raidVals.find(v => v !== raid);
    const n = fttRaw && (fttRaw.match(/\d+/) || [])[0];
    payload["RAID / FTT"] = [raid, n ? `FTT-${n}` : fttRaw].filter(Boolean).join(", ");
    payload["Тип vSAN"] = RAID_VALUE;
  }

  HW_KEYS.forEach(key => {
    if (!(key in item)) return;
    payload[fieldLabel(key)] = fmtHw(item[key]);
  });

  if (item[PRICE_KEY] != null) payload["Цена"] = fmt(item[PRICE_KEY]);
  payload["Max CPU usage"] = item["Max CPU usage"];

  // По просьбе — доступные ресурсы добавляются в конец лога отдельным блоком,
  // на самой карточке они не показываются.
  ["vCPU available", "vRAM available", "vSSD available", "vGPU available"].forEach(key => {
    payload[key] = item[key];
  });

  return payload;
}

// Текстовое представление объекта для буфера обмена: "Подпись: значение" по
// строкам, в том же порядке, в каком поля собраны в buildOrderPayload.
function payloadToText(payload) {
  return Object.entries(payload)
    .map(([label, value]) => `${label}: ${value}`)
    .join("\n");
}

async function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // идём в запасной вариант ниже (например, страница открыта не по https)
    }
  }
  // Запасной вариант для браузеров/контекстов без Clipboard API.
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

async function onOrderClick(item, idx, request, btn) {
  const text = payloadToText(buildOrderPayload(item, request));
  const ok = await copyToClipboard(text);

  if (!btn) return;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = ok ? "Скопировано ✓" : "Не удалось скопировать";
  setTimeout(() => {
    btn.textContent = original;
    btn.disabled = false;
  }, 1500);
}

function renderResults(data, request) {
  request = request || {};
  const wrap = document.getElementById("results-wrap");
  wrap.innerHTML = "";

  const summary = document.createElement("div");
  summary.id = "results-summary";

  if (!Array.isArray(data) || data.length === 0) {
    summary.textContent = "Получено вариантов: 0";
    wrap.appendChild(summary);

    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Ни один вариант конфигурации не подошёл под заданные параметры. Попробуйте ослабить требования.";
    wrap.appendChild(empty);
    return;
  }

  summary.textContent = `Получено вариантов: ${data.length}`;
  wrap.appendChild(summary);

  const grid = document.createElement("div");
  grid.className = "cards-grid";

  data.forEach((item, idx) => {
    // бэкенд сортирует варианты по цене, поэтому первый — самый выгодный
    const isBest = idx === 0 && data.length > 1;
    const card = document.createElement("div");
    card.className = "config-card" + (isBest ? " best" : "");

    const price = item[PRICE_KEY] != null ? fmt(item[PRICE_KEY]) : "";
    const head = document.createElement("div");
    head.className = "card-header";
    head.innerHTML = `<div><h3 class="card-title">Конфигурация #${idx + 1}</h3>${isBest ? '<span class="vbadge">Лучшая цена</span>' : ""}</div>`
      + `<div class="card-price"><div class="price-value">${esc(price)}</div>${PRICE_NOTE ? `<div class="price-note">${esc(PRICE_NOTE)}</div>` : ""}</div>`;
    card.appendChild(head);

    // 📊 Запрошенные ресурсы
    const req = [];
    REQUESTED.forEach(r => {
      let v = r.api && item[r.api] != null ? item[r.api] : request[r.param];
      if (v === undefined || v === "") return;
      let text = fmt(Number.isFinite(Number(v)) && !Array.isArray(v) ? Number(v) : v);
      if (r.unit) text += " " + r.unit;
      req.push(specItem(r.label, text, r.tip));
    });
    if (req.length) card.appendChild(cardSection("Запрошенные ресурсы", specsGrid(req), "resources"));

    // 🖥️ Конфигурация кластера
    const cl = [];
    if (item[HOSTS_KEY] != null) {
      const label = item[REDUNDANCY_KEY] ? `Кол-во хостов (${item[REDUNDANCY_KEY]})` : "Кол-во хостов";
      cl.push(specItem(label, fmt(item[HOSTS_KEY])));
    }
    const raidVals = RAID_KEYS.map(k => item[k]).filter(v => v != null && v !== "").map(v => String(fmt(v)));
    if (raidVals.length) {
      const raid = raidVals.find(v => /raid/i.test(v));
      const fttRaw = raidVals.find(v => v !== raid);
      const n = fttRaw && (fttRaw.match(/\d+/) || [])[0];
      const fttText = n ? `FTT-${n}` : fttRaw;
      const tip = n ? `Failures To Tolerate = ${n}. Конфигурация допускает одновременный отказ до ${n} дисков или узлов кластера без потери данных и доступности сервисов.` : undefined;

      // Расположение: сверху ALL FLASH VSAN, снизу RAID и FTT (подсказка на FTT).
      // Стиль при этом как у обычного spec-item — сверху мельче, снизу крупнее,
      // поэтому классы .spec-label/.spec-value привязаны не к смыслу поля,
      // а к позиции: верхняя строка мелкая, нижняя — крупная.
      const d = document.createElement("div");
      d.className = "spec-item";
      const fttHtml = fttText
        ? (tip
            ? `<span class="tooltip" tabindex="0">${esc(fttText)}<span class="tooltip-text">${esc(tip)}</span></span>`
            : esc(fttText))
        : "";
      d.innerHTML = `<span class="spec-label">${esc(RAID_VALUE)}</span>`
        + `<span class="spec-value">${[raid ? esc(raid) : "", fttHtml].filter(Boolean).join(", ")}</span>`;
      cl.push(d);
    }
    if (cl.length) card.appendChild(cardSection("Конфигурация кластера", specsGrid(cl), "cluster"));

    // ⚙️ Спецификация оборудования
    const ul = document.createElement("ul");
    ul.className = "hw-list";
    HW_KEYS.forEach(key => {
      if (!(key in item)) return;
      const li = document.createElement("li");
      li.innerHTML = `<span><b>${esc(fieldLabel(key))}:</b> ${esc(fmtHw(item[key]))}</span>`;
      ul.appendChild(li);
    });
    if (ul.children.length) card.appendChild(cardSection("Спецификация оборудования", ul, "hardware"));

    const foot = document.createElement("div");
    foot.className = "card-footer";
    const btn = document.createElement("button");
    btn.className = "btn-order";
    btn.textContent = "Копировать";
    btn.addEventListener("click", () => onOrderClick(item, idx, request, btn));
    foot.appendChild(btn);
    card.appendChild(foot);

    grid.appendChild(card);
  });
  wrap.appendChild(grid);
}

async function executeRequest() {
  const statusEl = document.getElementById("status-inline");
  const btn = document.getElementById("execute-btn");
  const { values, valid } = collectParams();

  if (!valid) {
    statusEl.textContent = "Заполните все обязательные поля";
    statusEl.className = "status-inline err";
    return;
  }

  const base = "/config";
  const qs = buildQueryString(values);
  const url = `${base}${base.includes("?") ? "&" : "?"}${qs}`;

  btn.disabled = true;
  statusEl.textContent = "Выполняется запрос…";
  statusEl.className = "status-inline";

  try {
    const resp = await fetch(url, { headers: { accept: "application/json" } });
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    if (!resp.ok) {
      statusEl.textContent = `Ошибка: ${resp.status} ${resp.statusText}`;
      statusEl.className = "status-inline err";
      const wrap = document.getElementById("results-wrap");
      wrap.innerHTML = "";
      const pre = document.createElement("pre");
      pre.className = "raw-json";
      pre.style.display = "block";
      pre.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      wrap.appendChild(pre);
      return;
    }

    statusEl.textContent = `200 OK`;
    statusEl.className = "status-inline ok";
    renderResults(data, values);
  } catch (e) {
    statusEl.textContent = "Не удалось выполнить запрос: " + e.message;
    statusEl.className = "status-inline err";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("execute-btn").addEventListener("click", executeRequest);
</script>
